<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 220" width="900" height="220" role="img" aria-labelledby="ue-feat-title ue-feat-desc">
  <title id="ue-feat-title">UberEats Delivery Key Capabilities</title>
  <desc id="ue-feat-desc">Three capability cards: Storefront and Menus, Green Delivery and Maps, Responsive Modular UI.</desc>
  <style>
    .ue-feat-root {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }
    .ue-feat-card {
      fill: none;
      stroke: #374151;
      stroke-width: 1.2;
    }
    .ue-feat-title {
      font-size: 17px;
      font-weight: 700;
      fill: #f3f3f3;
    }
    .ue-feat-tag {
      font-size: 12.5px;
      font-weight: 600;
      fill: #06C167;
    }
    .ue-feat-body {
      font-size: 13.5px;
      fill: #9ca3af;
    }
    .ue-feat-icon {
      fill: none;
      stroke: #06C167;
      stroke-width: 1.8;
      stroke-linecap: round;
      stroke-linejoin: round;
      stroke-dasharray: 80;
      stroke-dashoffset: 80;
      animation: ue-draw 3s ease-in-out infinite alternate;
    }
    .ue-d1 { animation-delay: 0s; }
    .ue-d2 { animation-delay: 0.6s; }
    .ue-d3 { animation-delay: 1.2s; }
    @keyframes ue-draw {
      0% { stroke-dashoffset: 80; }
      45%, 100% { stroke-dashoffset: 0; }
    }

    .ue-c1 { animation: ue-cw 6s ease-in-out infinite 0s; }
    .ue-c2 { animation: ue-cw 6s ease-in-out infinite 2s; }
    .ue-c3 { animation: ue-cw 6s ease-in-out infinite 4s; }
    @keyframes ue-cw {
      0%, 100% { stroke: #374151; stroke-width: 1.2; }
      12%, 28% { stroke: #06C167; stroke-width: 1.8; }
    }

    .ue-bar-bg { stroke: #374151; stroke-opacity: 0.45; stroke-width: 2; stroke-linecap: round; }
    .ue-prog { stroke: #06C167; stroke-width: 2; stroke-linecap: round; stroke-dasharray: 228; stroke-dashoffset: 228; }
    .ue-p1 { animation: ue-pg 6s ease-in-out infinite 0s; }
    .ue-p2 { animation: ue-pg 6s ease-in-out infinite 2s; }
    .ue-p3 { animation: ue-pg 6s ease-in-out infinite 4s; }
    @keyframes ue-pg {
      0% { stroke-dashoffset: 228; opacity: 0.4; }
      15%, 30% { stroke-dashoffset: 0; opacity: 1; }
      40%, 100% { stroke-dashoffset: 228; opacity: 0.2; }
    }

    @media (prefers-color-scheme: light) {
      .ue-feat-card { stroke: #d1d5db; }
      .ue-feat-title { fill: #111827; }
      .ue-feat-body { fill: #4b5563; }
      .ue-bar-bg { stroke: #d1d5db; }
      @keyframes ue-cw {
        0%, 100% { stroke: #d1d5db; stroke-width: 1.2; }
        12%, 28% { stroke: #06C167; stroke-width: 1.8; }
      }
    }
    @media (prefers-reduced-motion: reduce) {
      * { animation: none !important; transition: none !important; }
      .ue-feat-icon, .ue-prog { stroke-dashoffset: 0 !important; opacity: 0.9 !important; }
    }
  </style>

  <g class="ue-feat-root" transform="translate(24, 16)">
    <!-- Card 1 -->
    <rect class="ue-feat-card ue-c1" x="0" y="0" width="272" height="188" rx="16" />
    <text class="ue-feat-tag" x="22" y="34">01 / STOREFRONT</text>
    <path class="ue-feat-icon ue-d1" d="M230 22 H248 M230 29 H248 M230 36 H242" />
    <text class="ue-feat-title" x="22" y="64">Menus &amp; Collections</text>
    <text class="ue-feat-body" x="22" y="96">Browse curated restaurant</text>
    <text class="ue-feat-body" x="22" y="118">collections, promotional</text>
    <text class="ue-feat-body" x="22" y="140">offers, and detailed item</text>
    <text class="ue-feat-body" x="22" y="162">views via ProductService.</text>
    <line class="ue-bar-bg" x1="22" y1="176" x2="250" y2="176" />
    <line class="ue-prog ue-p1" x1="22" y1="176" x2="250" y2="176" />

    <!-- Card 2 -->
    <rect class="ue-feat-card ue-c2" x="290" y="0" width="272" height="188" rx="16" />
    <text class="ue-feat-tag" x="312" y="34">02 / DELIVERY</text>
    <path class="ue-feat-icon ue-d2" d="M522 36 C522 28 534 28 534 36 C534 42 528 46 528 46 C528 46 522 42 522 36 Z" />
    <text class="ue-feat-title" x="312" y="64">Green &amp; Maps Flow</text>
    <text class="ue-feat-body" x="312" y="96">Dedicated Green Delivery</text>
    <text class="ue-feat-body" x="312" y="118">experience, Uber One</text>
    <text class="ue-feat-body" x="312" y="140">membership views, and</text>
    <text class="ue-feat-body" x="312" y="162">Google Maps integration.</text>
    <line class="ue-bar-bg" x1="312" y1="176" x2="540" y2="176" />
    <line class="ue-prog ue-p2" x1="312" y1="176" x2="540" y2="176" />

    <!-- Card 3 -->
    <rect class="ue-feat-card ue-c3" x="580" y="0" width="272" height="188" rx="16" />
    <text class="ue-feat-tag" x="602" y="34">03 / DESIGN</text>
    <rect class="ue-feat-icon ue-d3" x="812" y="21" width="18" height="18" rx="4" />
    <text class="ue-feat-title" x="602" y="64">Modular Vue UI</text>
    <text class="ue-feat-body" x="602" y="96">Built with Vue 3, Vite,</text>
    <text class="ue-feat-body" x="602" y="118">PrimeVue components,</text>
    <text class="ue-feat-body" x="602" y="140">Uber Move typography,</text>
    <text class="ue-feat-body" x="602" y="162">and light/dark styling.</text>
    <line class="ue-bar-bg" x1="602" y1="176" x2="830" y2="176" />
    <line class="ue-prog ue-p3" x1="602" y1="176" x2="830" y2="176" />
  </g>
</svg>
