<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 220" width="100%" role="img" aria-labelledby="ue-feat-title ue-feat-desc">
  <title id="ue-feat-title">UberEats Delivery Key Capabilities</title>
  <desc id="ue-feat-desc">Three capability cards: Storefront and Menus, Green Delivery and Maps, Responsive Modular UI.</desc>
  <style>
    .ue-feat-root {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }
    .ue-feat-card {
      fill: none;
      stroke: #374151;
      stroke-width: 1.2;
    }
    .ue-feat-card-green {
      fill: none;
      stroke: #06C167;
      stroke-width: 1.2;
    }
    .ue-feat-title {
      font-size: 17px;
      font-weight: 700;
      fill: #f3f3f3;
    }
    .ue-feat-tag {
      font-size: 12.5px;
      font-weight: 600;
      fill: #06C167;
    }
    .ue-feat-body {
      font-size: 13.5px;
      fill: #9ca3af;
    }
    @media (prefers-color-scheme: light) {
      .ue-feat-card { stroke: #d1d5db; }
      .ue-feat-title { fill: #111827; }
      .ue-feat-body { fill: #4b5563; }
    }
    @media (prefers-reduced-motion: reduce) {
      * { animation: none !important; transition: none !important; }
    }
  </style>

  <g class="ue-feat-root" transform="translate(24, 16)">
    <!-- Card 1 -->
    <rect class="ue-feat-card" x="0" y="0" width="272" height="184" rx="16" />
    <text class="ue-feat-tag" x="22" y="34">01 / STOREFRONT</text>
    <text class="ue-feat-title" x="22" y="64">Menus &amp; Collections</text>
    <text class="ue-feat-body" x="22" y="96">Browse curated restaurant</text>
    <text class="ue-feat-body" x="22" y="118">collections, promotional</text>
    <text class="ue-feat-body" x="22" y="140">offers, and detailed item</text>
    <text class="ue-feat-body" x="22" y="162">views via ProductService.</text>

    <!-- Card 2 -->
    <rect class="ue-feat-card-green" x="290" y="0" width="272" height="184" rx="16" />
    <text class="ue-feat-tag" x="312" y="34">02 / DELIVERY</text>
    <text class="ue-feat-title" x="312" y="64">Green &amp; Maps Flow</text>
    <text class="ue-feat-body" x="312" y="96">Dedicated Green Delivery</text>
    <text class="ue-feat-body" x="312" y="118">experience, Uber One</text>
    <text class="ue-feat-body" x="312" y="140">membership views, and</text>
    <text class="ue-feat-body" x="312" y="162">Google Maps integration.</text>

    <!-- Card 3 -->
    <rect class="ue-feat-card" x="580" y="0" width="272" height="184" rx="16" />
    <text class="ue-feat-tag" x="602" y="34">03 / DESIGN</text>
    <text class="ue-feat-title" x="602" y="64">Modular Vue UI</text>
    <text class="ue-feat-body" x="602" y="96">Built with Vue 3, Vite,</text>
    <text class="ue-feat-body" x="602" y="118">PrimeVue components,</text>
    <text class="ue-feat-body" x="602" y="140">Uber Move typography,</text>
    <text class="ue-feat-body" x="602" y="162">and light/dark styling.</text>
  </g>
</svg>
