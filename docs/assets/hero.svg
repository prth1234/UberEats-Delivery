<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 250" width="900" height="250" role="img" aria-labelledby="ue-hero-title ue-hero-desc">
  <title id="ue-hero-title">UberEats Delivery</title>
  <desc id="ue-hero-desc">Vue 3 food delivery storefront with restaurant discovery, interactive menus, and green delivery flows.</desc>
  <defs>
    <path id="ue-hero-track" d="M 0 132 L 620 132" fill="none"/>
  </defs>
  <style>
    .ue-hero-root {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }
    .ue-hero-eyebrow {
      font-size: 13px;
      font-weight: 600;
      letter-spacing: 0.12em;
      fill: #06C167;
    }
    .ue-hero-display {
      font-size: 48px;
      font-weight: 800;
      letter-spacing: -0.02em;
      fill: #f3f3f3;
    }
    .ue-hero-accent {
      fill: #06C167;
    }
    .ue-hero-sub {
      font-size: 15px;
      fill: #9ca3af;
    }
    .ue-hero-line {
      stroke: #06C167;
      stroke-opacity: 0.25;
      stroke-width: 1.5;
    }
    .ue-hero-pill {
      fill: none;
      stroke: #374151;
      stroke-width: 1.2;
    }
    .ue-hero-pill-text {
      font-size: 13px;
      font-weight: 500;
      fill: #d1d5db;
    }

    .ue-ring {
      fill: none;
      stroke: #06C167;
      stroke-width: 1.5;
      transform-box: fill-box;
      transform-origin: center;
      animation: ue-radar 2.4s ease-out infinite;
    }
    .ue-hero-pulse {
      fill: #06C167;
      animation: ue-hero-blink 2.4s ease-in-out infinite;
    }
    @keyframes ue-radar {
      0% { transform: scale(1); opacity: 0.9; }
      100% { transform: scale(2.8); opacity: 0; }
    }
    @keyframes ue-hero-blink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.35; }
    }

    .ue-tag-1 { opacity: 1; animation: ue-cyc-1 9s ease-in-out infinite; }
    .ue-tag-2 { opacity: 0; animation: ue-cyc-2 9s ease-in-out infinite; }
    .ue-tag-3 { opacity: 0; animation: ue-cyc-3 9s ease-in-out infinite; }
    @keyframes ue-cyc-1 { 0%, 28% { opacity: 1; } 33%, 95% { opacity: 0; } 100% { opacity: 1; } }
    @keyframes ue-cyc-2 { 0%, 30% { opacity: 0; } 35%, 61% { opacity: 1; } 66%, 100% { opacity: 0; } }
    @keyframes ue-cyc-3 { 0%, 63% { opacity: 0; } 68%, 94% { opacity: 1; } 99%, 100% { opacity: 0; } }

    .ue-pill-1 { animation: ue-pw 7.5s ease-in-out infinite 0s; }
    .ue-pill-2 { animation: ue-pw 7.5s ease-in-out infinite 1.5s; }
    .ue-pill-3 { animation: ue-pw 7.5s ease-in-out infinite 3.0s; }
    .ue-pill-4 { animation: ue-pw 7.5s ease-in-out infinite 4.5s; }
    .ue-pill-5 { animation: ue-pw 7.5s ease-in-out infinite 6.0s; }
    .ue-ptxt-1 { animation: ue-pt 7.5s ease-in-out infinite 0s; }
    .ue-ptxt-2 { animation: ue-pt 7.5s ease-in-out infinite 1.5s; }
    .ue-ptxt-3 { animation: ue-pt 7.5s ease-in-out infinite 3.0s; }
    .ue-ptxt-4 { animation: ue-pt 7.5s ease-in-out infinite 4.5s; }
    .ue-ptxt-5 { animation: ue-pt 7.5s ease-in-out infinite 6.0s; }
    @keyframes ue-pw {
      0%, 100% { stroke: #374151; stroke-width: 1.2; }
      10%, 22% { stroke: #06C167; stroke-width: 1.8; }
    }
    @keyframes ue-pt {
      0%, 100% { fill: #d1d5db; }
      10%, 22% { fill: #06C167; }
    }

    @media (prefers-color-scheme: light) {
      .ue-hero-display { fill: #111827; }
      .ue-hero-sub { fill: #4b5563; }
      .ue-hero-pill { stroke: #d1d5db; }
      .ue-hero-pill-text { fill: #374151; }
      @keyframes ue-pw {
        0%, 100% { stroke: #d1d5db; stroke-width: 1.2; }
        10%, 22% { stroke: #06C167; stroke-width: 1.8; }
      }
      @keyframes ue-pt {
        0%, 100% { fill: #374151; }
        10%, 22% { fill: #06C167; }
      }
    }
    @media (prefers-reduced-motion: reduce) {
      * { animation: none !important; transition: none !important; }
      .motion-only { display: none; }
    }
  </style>

  <g class="ue-hero-root" transform="translate(24, 28)">
    <circle class="ue-ring motion-only" cx="6" cy="10" r="4.5" />
    <circle class="ue-hero-pulse" cx="6" cy="10" r="4.5" />
    <text class="ue-hero-eyebrow" x="20" y="15">VUE 3 / VITE / VUE ROUTER / PRIMEVUE</text>

    <text class="ue-hero-display" x="0" y="74">
      UberEats <tspan class="ue-hero-accent">Delivery</tspan>
    </text>

    <text class="ue-hero-sub ue-tag-1" x="0" y="112">Food delivery storefront with restaurant discovery, interactive menus, map routing, and green delivery flows.</text>
    <text class="ue-hero-sub ue-tag-2" x="0" y="112">Curated collections, promotional offers, and detailed menu views powered by ProductService.</text>
    <text class="ue-hero-sub ue-tag-3" x="0" y="112">Dedicated Green Delivery (/green), Uber One membership views, and @fawmi/vue-google-maps.</text>

    <line class="ue-hero-line" x1="0" y1="132" x2="620" y2="132" />
    <circle r="3.5" fill="#06C167" class="motion-only">
      <animateMotion dur="3.5s" repeatCount="indefinite"><mpath href="#ue-hero-track" /></animateMotion>
    </circle>

    <g transform="translate(0, 156)">
      <rect class="ue-hero-pill ue-pill-1" x="0" y="0" width="96" height="32" rx="16" />
      <text class="ue-hero-pill-text ue-ptxt-1" x="48" y="21" text-anchor="middle">Vue 3.4</text>

      <rect class="ue-hero-pill ue-pill-2" x="108" y="0" width="92" height="32" rx="16" />
      <text class="ue-hero-pill-text ue-ptxt-2" x="154" y="21" text-anchor="middle">Vite 5</text>

      <rect class="ue-hero-pill ue-pill-3" x="212" y="0" width="114" height="32" rx="16" />
      <text class="ue-hero-pill-text ue-ptxt-3" x="269" y="21" text-anchor="middle">PrimeVue 3</text>

      <rect class="ue-hero-pill ue-pill-4" x="338" y="0" width="134" height="32" rx="16" />
      <text class="ue-hero-pill-text ue-ptxt-4" x="405" y="21" text-anchor="middle">Google Maps</text>

      <rect class="ue-hero-pill ue-pill-5" x="484" y="0" width="116" height="32" rx="16" />
      <text class="ue-hero-pill-text ue-ptxt-5" x="542" y="21" text-anchor="middle">Uber Move</text>
    </g>
  </g>
</svg>
