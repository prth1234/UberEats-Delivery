<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 250" width="100%" role="img" aria-labelledby="ue-hero-title ue-hero-desc">
  <title id="ue-hero-title">UberEats Delivery</title>
  <desc id="ue-hero-desc">Vue 3 food delivery storefront with restaurant discovery, interactive menus, and green delivery flows.</desc>
  <style>
    .ue-hero-root {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }
    .ue-hero-eyebrow {
      font-size: 13px;
      font-weight: 600;
      letter-spacing: 0.12em;
      fill: #06C167;
    }
    .ue-hero-display {
      font-size: 48px;
      font-weight: 800;
      letter-spacing: -0.02em;
      fill: #f3f3f3;
    }
    .ue-hero-accent {
      fill: #06C167;
    }
    .ue-hero-sub {
      font-size: 15px;
      fill: #9ca3af;
    }
    .ue-hero-pill {
      fill: none;
      stroke: #374151;
      stroke-width: 1.2;
    }
    .ue-hero-pill-green {
      fill: none;
      stroke: #06C167;
      stroke-width: 1.2;
    }
    .ue-hero-pill-text {
      font-size: 13px;
      font-weight: 500;
      fill: #d1d5db;
    }
    .ue-hero-pill-text-green {
      font-size: 13px;
      font-weight: 600;
      fill: #06C167;
    }
    .ue-hero-pulse {
      animation: ue-hero-blink 2.4s ease-in-out infinite;
    }
    @keyframes ue-hero-blink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.35; }
    }
    @media (prefers-color-scheme: light) {
      .ue-hero-display { fill: #111827; }
      .ue-hero-sub { fill: #4b5563; }
      .ue-hero-pill { stroke: #d1d5db; }
      .ue-hero-pill-text { fill: #374151; }
    }
    @media (prefers-reduced-motion: reduce) {
      .ue-hero-pulse { animation: none; }
    }
  </style>

  <g class="ue-hero-root" transform="translate(24, 32)">
    <circle class="ue-hero-pulse" cx="6" cy="10" r="4.5" fill="#06C167" />
    <text class="ue-hero-eyebrow" x="20" y="15">VUE 3 / VITE / VUE ROUTER / PRIMEVUE</text>

    <text class="ue-hero-display" x="0" y="76">
      UberEats <tspan class="ue-hero-accent">Delivery</tspan>
    </text>

    <text class="ue-hero-sub" x="0" y="114">
      Food delivery storefront with restaurant discovery, interactive menus, map routing, and green delivery flows.
    </text>

    <g transform="translate(0, 146)">
      <rect class="ue-hero-pill-green" x="0" y="0" width="96" height="32" rx="16" />
      <text class="ue-hero-pill-text-green" x="48" y="21" text-anchor="middle">Vue 3.4</text>

      <rect class="ue-hero-pill" x="108" y="0" width="92" height="32" rx="16" />
      <text class="ue-hero-pill-text" x="154" y="21" text-anchor="middle">Vite 5</text>

      <rect class="ue-hero-pill" x="212" y="0" width="114" height="32" rx="16" />
      <text class="ue-hero-pill-text" x="269" y="21" text-anchor="middle">PrimeVue 3</text>

      <rect class="ue-hero-pill" x="338" y="0" width="134" height="32" rx="16" />
      <text class="ue-hero-pill-text" x="405" y="21" text-anchor="middle">Google Maps</text>

      <rect class="ue-hero-pill" x="484" y="0" width="116" height="32" rx="16" />
      <text class="ue-hero-pill-text" x="542" y="21" text-anchor="middle">Uber Move</text>
    </g>
  </g>
</svg>
